name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: stockly-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK to the "latest" release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk stockly.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest stockly.apk --title "Stockly (latest build)" \
            --notes "Built from ${GITHUB_SHA::7}. Download stockly.apk on your phone to install." --target "$GITHUB_SHA"
